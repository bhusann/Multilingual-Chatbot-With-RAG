<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Scheme Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #1e293b;
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 28px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }

        .message.assistant .sources {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #334155;
            font-size: 12px;
            color: #94a3b8;
        }

        .message.assistant .sources span {
            display: inline-block;
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 2px 4px 2px 0;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .welcome p {
            font-size: 14px;
        }

        /* Input area */
        .input-area {
            background: #1e293b;
            padding: 16px 24px;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .text-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 12px 20px;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: #2563eb;
        }

        .text-input::placeholder {
            color: #64748b;
        }

        /* Mic button */
        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }

        .mic-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: #dc2626;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        /* Status bar */
        .status {
            padding: 8px 24px;
            font-size: 12px;
            color: #64748b;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }

        /* Loading indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-icon">🏛️</span>
        <div>
            <h1>Government Scheme Assistant</h1>
            <p>Ask about government schemes in any language</p>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h2>How can I help you?</h2>
            <p>Ask about any government scheme — eligibility, benefits, how to apply.<br>
            You can speak in English, Hindi, Tamil, or any language.</p>
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            class="text-input"
            id="textInput"
            placeholder="Type your question..."
            autocomplete="off"
        >
        <button class="send-btn" id="sendBtn" disabled title="Send">➤</button>
        <button class="mic-btn" id="micBtn" title="Hold to speak">🎤</button>
    </div>

    <div class="status">
        <span>
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </span>
        <span>Admin: <a href="/admin" style="color:#64748b">/admin</a></span>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const welcome = document.getElementById('welcome');
        const statusText = document.getElementById('statusText');

        let chatHistory = [];
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        // Enable send button when text is entered
        textInput.addEventListener('input', () => {
            sendBtn.disabled = !textInput.value.trim();
        });

        // Send on Enter
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (textInput.value.trim()) sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // ========== TEXT CHAT ==========
        async function sendMessage() {
            const text = textInput.value.trim();
            if (!text) return;

            textInput.value = '';
            sendBtn.disabled = true;

            // Hide welcome
            if (welcome) welcome.style.display = 'none';

            // Add user message
            addMessage(text, 'user');

            // Show typing indicator
            const typingEl = addTyping();

            // Stream response
            statusText.textContent = 'Thinking...';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory,
                    }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let replyText = '';
                let sources = [];

                // Remove typing indicator
                typingEl.remove();

                // Create assistant message element
                const assistantEl = createMessageElement('', 'assistant');
                chatContainer.appendChild(assistantEl);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.text) {
                                    replyText += data.text;
                                    assistantEl.querySelector('.text').textContent = replyText;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }

                                if (data.sources) {
                                    sources = data.sources;
                                }

                                if (data.done) {
                                    // Add sources
                                    if (sources.length > 0) {
                                        const sourcesEl = document.createElement('div');
                                        sourcesEl.className = 'sources';
                                        sourcesEl.innerHTML = 'Sources: ' +
                                            sources.map(s => `<span>${s.filename}</span>`).join('');
                                        assistantEl.appendChild(sourcesEl);
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                }

                // Update history
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: replyText });

                // Keep history manageable (last 10 turns)
                if (chatHistory.length > 20) {
                    chatHistory = chatHistory.slice(-20);
                }

                // Speak the reply
                if (replyText) speakText(replyText);

            } catch (error) {
                typingEl.remove();
                addMessage('Sorry, something went wrong. Please try again.', 'assistant');
            }

            statusText.textContent = 'Ready';
        }

        // ========== VOICE INPUT ==========
        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('mouseleave', stopRecording);
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        micBtn.addEventListener('touchend', stopRecording);

        async function startRecording() {
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());

                    if (audioChunks.length === 0) return;

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendVoice(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                statusText.textContent = 'Listening...';

            } catch (err) {
                console.error('Microphone error:', err);
                statusText.textContent = 'Microphone access denied';
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;

            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            statusText.textContent = 'Processing...';
        }

        async function sendVoice(audioBlob) {
            if (welcome) welcome.style.display = 'none';

            const formData = new FormData();
            formData.append('file', audioBlob, 'audio.webm');

            try {
                const response = await fetch('/api/voice', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (data.text) {
                    addMessage(data.text, 'user');
                }

                if (data.reply) {
                    addMessage(data.reply, 'assistant');

                    if (data.sources && data.sources.length > 0) {
                        // Could show sources here too
                    }

                    speakText(data.reply);
                }

            } catch (error) {
                addMessage('Sorry, could not process your voice. Please try again.', 'assistant');
            }

            statusText.textContent = 'Ready';
        }

        // ========== TTS ==========
        async function speakText(text) {
            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, lang: 'en' }),
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play();
                }
            } catch (e) {
                console.log('TTS failed, skipping audio');
            }
        }

        // ========== HELPERS ==========
        function addMessage(text, role) {
            const el = createMessageElement(text, role);
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }

        function createMessageElement(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="text">${escapeHtml(text)}</div>`;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
